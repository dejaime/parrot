[package]
name = "parrot-rng"
version = "0.1.5"
edition = "2024"

description = "A lightweight, strictly deterministic procedural generation library for Rust"
authors = ["Dejaime de Oliveira <contact@dejai.me>"]
license = "MIT OR Apache-2.0 OR GPL-3.0-only OR LGPL-3.0-only"

repository = "https://github.com/dejaime/parrot"
readme = "README.md"


categories = ["game-development", "simulation", "algorithms", "no-std"]
keywords = [
            "random", "rng", "simulation", "procedural", "gamedev"
        ]

[lib]
name = "parrot"
path = "src/lib.rs"

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[profile.release]
lto = true
opt-level = "z"
panic = "abort"

[features]
default = []
rand-support = ["dep:rand_core"]

[dependencies]
# Optional dependency for rand compatibility (e.g. allows use of `rand::seq::SliceRandom`)
rand_core = { version = "0.6", default-features = false, optional = true }

[dev-dependencies]
num_cpus = "1.16.0"
rand = "0.8"
