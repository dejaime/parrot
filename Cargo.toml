[package]
name = "parrot-rng"
version = "0.1.0"
edition = "2024"

description = "A very experimental crate for mod support in Bevy Game Engine games"
authors = ["Dejaime de Oliveira <contact@dejai.me>"]
license = "MIT OR Apache-2.0 OR GPL-3.0-only OR LGPL-3.0-only"

homepage = "https://dejai.me/parrot-rng"
documentation = "https://dejai.me/parrot-rng/docs"
repository = "https://github.com/dejaime/parrot-rng"
readme = "README.md"


categories = ["game-development", "simulation", "algorithms", "no-std"]
keywords = [
            "random", "rng", "simulation", "procedural", "gamedev"
        ]

[lib]
crate-type = ["rlib"]
name = "parrot"      # This allows 'use parrot::Parrot;'
path = "src/lib.rs"

[profile.release]
lto = true
opt-level = "z"
panic = "abort"

[dev-dependencies]
num_cpus = "1.16.0"